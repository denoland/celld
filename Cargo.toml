[package]
name = "self-hosted-deno-deploy"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
http = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

pingora = { version = "0.4", features = ["proxy"] }
#pingora-error = "0.4"

[patch.crates-io]
sfv = { path = "vendor/sfv" }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tokio-test = "0.4"
tokio-tungstenite = "0.20"
futures-util = "0.3"
reqwest = "0.12" # Do not use reqwest in the main code, only in tests
url = "2.5"
