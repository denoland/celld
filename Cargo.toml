[package]
name = "celld"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = "1.1.6"
aws-sdk-s3 = "1.23.0"
aws-smithy-types = "1.1.6"
chrono = { version = "0.4", features = ["serde"] }
hashring = "0.3.6"
http = "1"
nix = { version = "0.30", features = ["process", "signal", "fs"] }
once_cell = "1"
pingora = { version = "0.5", features = ["proxy"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.19.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
lazy_static = "1.4"
tokio-test = "0.4"
tokio-tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] } # Do not use reqwest in the main code, only in tests
url = "2.5"
