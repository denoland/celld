name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Caching configuration
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev

    - name: Install SQLite3 (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install sqlite3

    - name: Install Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Install Litestream (Linux)
      if: runner.os == 'Linux'
      run: |
        curl -L -o litestream.deb "https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.deb"
        sudo dpkg -i litestream.deb

    - name: Set up Docker (Linux)
      if: runner.os == 'Linux'
      uses: docker/setup-buildx-action@v2

    - name: Install Litestream (macOS)
      if: runner.os == 'macOS'
      run: |
        curl -L -o litestream.zip "https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-darwin-amd64.zip"
        unzip litestream.zip
        sudo install -m 755 litestream /usr/local/bin/litestream

    - name: Add Docker CLI to PATH (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "Current PATH: $PATH"
        # Ensure /usr/local/bin (common for symlinks from Docker Desktop) is in PATH
        if [[ ":$PATH:" != *":/usr/local/bin:"* ]]; then
          echo "/usr/local/bin" >> $GITHUB_PATH
          export PATH="/usr/local/bin:$PATH" # For current script's context
          echo "Added /usr/local/bin to PATH."
        fi

        # Ensure Docker.app's own bin directory is in PATH
        # This is often /Applications/Docker.app/Contents/Resources/bin
        DOCKER_APP_RESOURCES_BIN="/Applications/Docker.app/Contents/Resources/bin"
        if [ -d "$DOCKER_APP_RESOURCES_BIN" ]; then
          if [[ ":$PATH:" != *":$DOCKER_APP_RESOURCES_BIN:"* ]]; then
            echo "$DOCKER_APP_RESOURCES_BIN" >> $GITHUB_PATH
            export PATH="$DOCKER_APP_RESOURCES_BIN:$PATH" # For current script's context
            echo "Added $DOCKER_APP_RESOURCES_BIN to PATH."
          fi
        else
          echo "INFO: Docker.app resources bin directory not found at $DOCKER_APP_RESOURCES_BIN. This is okay if symlinks in /usr/local/bin exist and work."
        fi
        
        echo "Updated PATH for subsequent steps will include additions made via GITHUB_PATH."
        echo "Effective PATH for this script: $PATH"
        
        if ! command -v docker &> /dev/null; then
            echo "ERROR: 'docker' command still not found in PATH after modifications."
            echo "Listing /usr/local/bin and Docker.app bin for diagnostics:"
            ls -la /usr/local/bin || echo "/usr/local/bin not found or no permissions."
            if [ -d "$DOCKER_APP_RESOURCES_BIN" ]; then
              ls -la "$DOCKER_APP_RESOURCES_BIN" || echo "$DOCKER_APP_RESOURCES_BIN not found or no permissions."
            fi
            exit 1
        fi
        echo "Docker CLI found at: $(which docker)"
        echo "Attempting to get Docker version (daemon might not be responsive yet): $(docker --version || echo 'Docker CLI found, but daemon not yet responsive or other issue.')"

    - name: Start Docker Desktop (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "Starting Docker Desktop..."
        # Check if Docker.app exists
        if [ ! -d "/Applications/Docker.app" ]; then
          echo "ERROR: Docker.app not found at /Applications/Docker.app. Cannot start Docker."
          exit 1
        fi
        
        open -g -a /Applications/Docker.app # Open Docker.app in the background
        
        echo "Waiting for Docker daemon to start..."
        max_retries=60 # Wait for up to 120 seconds (60 retries * 2 seconds)
        count=0
        while ! docker system info > /dev/null 2>&1; do
          sleep 2
          count=$((count+1))
          if [ $count -ge $max_retries ]; then
            echo "ERROR: Docker daemon failed to start after $(($max_retries * 2)) seconds."
            echo "Attempting to get Docker system info for diagnostics:"
            docker system info # This will print the error from Docker itself
            exit 1
          fi
          echo -n "." # Progress indicator
        done
        echo "Docker daemon is running."
        docker --version # Confirm CLI and daemon are responsive


    - name: Set up Rust cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Setup hosts file
      run: |
        echo "Adding localhost entries to /etc/hosts"
        sudo bash -c 'cat >> /etc/hosts << EOF
        127.0.0.1 basic-db.localhost
        127.0.0.1 env-test.localhost
        127.0.0.1 hello.localhost
        127.0.0.1 llm-chat.localhost
        127.0.0.1 ws-echo.localhost
        EOF'

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

  lint:
    name: Linting and Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Rust cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-lint-

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

  docker:
    name: Docker Integration Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: docker build -t cells:test .

    - name: Setup hosts file
      run: |
        echo "Adding localhost entries to /etc/hosts"
        sudo bash -c 'cat >> /etc/hosts << EOF
        127.0.0.1 basic-db.localhost
        127.0.0.1 env-test.localhost
        127.0.0.1 hello.localhost
        127.0.0.1 llm-chat.localhost
        127.0.0.1 ws-echo.localhost
        EOF'

    - name: Run Docker container
      run: |
        docker run -d --name cells-test \
          -p 8000:8000 \
          -v $(pwd)/data:/data \
          cells:test
        # Wait for container to start
        sleep 5

    - name: Test HTTP endpoint
      run: |
        response=$(curl -s -H "Host: basic-db.localhost" http://127.0.0.1:8000/cell/foo)
        echo "Response: $response"
        # Check if response is not empty
        if [[ -z "$response" ]]; then
          echo "Test failed: Empty response from server"
          exit 1
        fi
