name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Caching configuration
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev

    - name: Install SQLite3 (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install sqlite3

    - name: Install Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Install Litestream (Linux)
      if: runner.os == 'Linux'
      run: |
        curl -L -o litestream.deb "https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.deb"
        sudo dpkg -i litestream.deb

    - name: Set up Docker (Linux)
      if: runner.os == 'Linux'
      uses: docker/setup-buildx-action@v2

    - name: Install Litestream (macOS)
      if: runner.os == 'macOS'
      run: |
        curl -L -o litestream.zip "https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-darwin-amd64.zip"
        unzip litestream.zip
        sudo install -m 755 litestream /usr/local/bin/litestream

# (Steps: checkout, install sqlite3 (macOS), install Deno, install Litestream (macOS) ... remain the same)

    # ---- START: Revised Docker Setup for macOS ----
    - name: Install and Prepare Docker Desktop (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "Checking for Docker Desktop..."
        if [ -d "/Applications/Docker.app" ]; then
          echo "Docker Desktop found at /Applications/Docker.app."
          # Even if App is found, CLI might be missing from PATH as per your logs
          if ! command -v docker &> /dev/null; then
             echo "WARN: Docker.app exists, but 'docker' CLI was not initially in PATH or standard symlinks are missing from /usr/local/bin."
             echo "The Docker Desktop installation might be incomplete or symlinks not created. Proceeding with PATH setup."
          fi
        else
          echo "Docker Desktop not found at /Applications/Docker.app."
          echo "Attempting to install Docker Desktop via Homebrew Cask..."
          # This will take some time as it downloads and installs Docker Desktop.
          brew install --cask docker
          if [ ! -d "/Applications/Docker.app" ]; then
            echo "ERROR: Docker Desktop installation via Homebrew failed or it's still not at /Applications/Docker.app."
            exit 1
          fi
          echo "Docker Desktop installed successfully."
        fi

        echo "Ensuring Docker CLI is in PATH..."
        # Docker Desktop should install symlinks to /usr/local/bin
        # Ensure /usr/local/bin is in GITHUB_PATH
        if [[ ":$PATH:" != *":/usr/local/bin:"* ]]; then
          echo "/usr/local/bin" >> $GITHUB_PATH
        fi
        
        # Also ensure the direct path within Docker.app bundle is in GITHUB_PATH
        # This is a fallback and good for robustness.
        DOCKER_APP_CLI_PATH="/Applications/Docker.app/Contents/Resources/bin"
        if [ -d "$DOCKER_APP_CLI_PATH" ]; then
          if [[ ":$PATH:" != *":$DOCKER_APP_CLI_PATH:"* ]]; then
             echo "$DOCKER_APP_CLI_PATH" >> $GITHUB_PATH
          fi
        else
          # If we just installed it, this path MUST exist.
          echo "ERROR: Critical Docker CLI path $DOCKER_APP_CLI_PATH not found even after installation."
          echo "The Docker Desktop installation may be corrupted."
          exit 1
        fi
        
        # For the current script step, make sure PATH is updated to find docker for verification
        export PATH="/usr/local/bin:$DOCKER_APP_CLI_PATH:$PATH"
        
        if ! command -v docker &> /dev/null; then
            echo "ERROR: 'docker' command still not findable after installation and PATH setup."
            echo "Listing /usr/local/bin:"
            ls -la /usr/local/bin
            echo "Listing $DOCKER_APP_CLI_PATH:"
            ls -la "$DOCKER_APP_CLI_PATH"
            exit 1
        fi
        echo "Docker CLI found at: $(which docker)"
        echo "Docker version (daemon may not be running yet): $(docker --version || echo 'CLI found, daemon not responsive')"

    - name: Start Docker Desktop and Wait for Daemon (macOS)
      if: runner.os == 'macOS'
      run: |
        if [ ! -d "/Applications/Docker.app" ]; then
          echo "ERROR: Docker.app not found, cannot start. The installation step might have failed."
          exit 1
        fi
        echo "Starting Docker Desktop..."
        open -g -a /Applications/Docker.app
        
        echo "Waiting for Docker daemon to start..."
        max_retries=90 # Increased to 3 minutes (90 retries * 2 seconds) as first launch after install can be slow
        count=0
        while ! docker system info > /dev/null 2>&1; do
          sleep 2
          count=$((count+1))
          if [ $count -ge $max_retries ]; then
            echo "ERROR: Docker daemon failed to start after $(($max_retries * 2)) seconds."
            echo "Attempting to get Docker system info for diagnostics (this may also fail):"
            docker system info
            exit 1
          fi
          echo -n "." # Progress indicator
        done
        echo "Docker daemon is running."
        docker --version # Confirm CLI and daemon are responsive

    # This is your original step for setting up Buildx, should now work
    - name: Set up Docker Buildx (macOS) 
      if: runner.os == 'macOS'
      uses: docker/setup-buildx-action@v2
    # ---- END: Revised Docker Setup for macOS ----

    - name: Set up Rust cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Setup hosts file
      run: |
        echo "Adding localhost entries to /etc/hosts"
        sudo bash -c 'cat >> /etc/hosts << EOF
        127.0.0.1 basic-db.localhost
        127.0.0.1 env-test.localhost
        127.0.0.1 hello.localhost
        127.0.0.1 llm-chat.localhost
        127.0.0.1 ws-echo.localhost
        EOF'

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

  lint:
    name: Linting and Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Rust cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-lint-

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

  docker:
    name: Docker Integration Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: docker build -t cells:test .

    - name: Setup hosts file
      run: |
        echo "Adding localhost entries to /etc/hosts"
        sudo bash -c 'cat >> /etc/hosts << EOF
        127.0.0.1 basic-db.localhost
        127.0.0.1 env-test.localhost
        127.0.0.1 hello.localhost
        127.0.0.1 llm-chat.localhost
        127.0.0.1 ws-echo.localhost
        EOF'

    - name: Run Docker container
      run: |
        docker run -d --name cells-test \
          -p 8000:8000 \
          -v $(pwd)/data:/data \
          cells:test
        # Wait for container to start
        sleep 5

    - name: Test HTTP endpoint
      run: |
        response=$(curl -s -H "Host: basic-db.localhost" http://127.0.0.1:8000/cell/foo)
        echo "Response: $response"
        # Check if response is not empty
        if [[ -z "$response" ]]; then
          echo "Test failed: Empty response from server"
          exit 1
        fi
