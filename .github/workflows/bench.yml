name: Benchmark

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  LITESTREAM_VERSION: v0.3.13

jobs:
  benchmark:
    name: Coldstart Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-benchmark')
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsqlite3-dev \
            curl \
            wget

          echo "Installing MinIO and mc for Linux..."
          wget https://dl.min.io/server/minio/release/linux-amd64/minio -O minio
          chmod +x minio
          sudo mv minio /usr/local/bin/
          wget https://dl.min.io/client/mc/release/linux-amd64/mc -O mc
          chmod +x mc
          sudo mv mc /usr/local/bin/
          minio --version
          mc --version

          echo "Installing Litestream for Linux..."
          curl -L -o litestream.deb "https://github.com/benbjohnson/litestream/releases/download/${LITESTREAM_VERSION}/litestream-${LITESTREAM_VERSION}-linux-amd64.deb"
          sudo dpkg -i litestream.deb
          litestream version

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: opt-nc/setup-duckdb-action@v1.0.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Setup hosts file
        run: |
          echo "Adding localhost entries to /etc/hosts"
          sudo bash -c 'cat >> /etc/hosts << EOF
          127.0.0.1 basic-db.localhost
          127.0.0.1 env-test.localhost
          127.0.0.1 hello.localhost
          127.0.0.1 llm-chat.localhost
          127.0.0.1 ws-echo.localhost
          EOF'

      - name: Build
        run: |
          cargo build --release

      - name: Run coldstart benchmark
        run: |
          ./target/release/celld > /dev/null 2>&1 &
          sleep 2
          echo "Running benchmark..."
          curl -s -o /dev/null -w '{ "url": "%{url_effective}", "status": %{http_code}, "latency": %{time_total} }\n' -H 'Host: hello.localhost' http://127.0.0.1:8000/cell/foo[1-500] > coldstart-benchmark.jsonl
          echo "Benchmark output saved to coldstart-benchmark.jsonl:"
          cat coldstart-benchmark.jsonl

      - name: Analyze
        id: analyze
        run: |
          ANALYZE=$(duckdb -c 'SELECT avg(latency) AS avg, median(latency) AS median, stddev(latency) AS stddev, min(latency) AS min, max(latency) AS max FROM read_json("coldstart-benchmark.jsonl", format="newline_delimited")')

          echo 'result<<EOF' >> $GITHUB_OUTPUT
          echo "$ANALYZE" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const benchmarkResult = `${{ steps.analyze.outputs.result }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "```\n" + benchmarkResult + "\n```\n",
            });

      - name: Comment on commit (push event)
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            ```
            ${{ steps.analyze.outputs.result }}
            ```
