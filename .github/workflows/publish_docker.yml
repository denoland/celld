name: Build and Publish Docker Images to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_push_main_celld:
    name: Build and Push Main Celld Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      commit_sha: ${{ github.sha }} # Output full commit SHA

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push main celld image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/denoland/cells:latest
            ghcr.io/denoland/cells:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_and_push_ecs_celld:
    name: Build and Push ECS Celld Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build_and_push_main_celld
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ECS celld image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ecs
          push: true
          tags: |
            ghcr.io/denoland/cells:ecs-latest
            ghcr.io/denoland/cells:ecs-${{ needs.build_and_push_main_celld.outputs.commit_sha }}
          build-args: |
            CELCD_BASE_IMAGE_TAG=${{ needs.build_and_push_main_celld.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
