[package]
name = "pingora_hyper"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Enable full hyper-based compatibility layer
hyper-compat = []
# Use only original Pingora implementation (mutually exclusive with hyper-compat)
pingora-only = []

[dependencies]
async-trait = "0.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-tungstenite = { version = "0.26" }
tower = { version = "0.5" }
thiserror = "2"
tracing = "0.1"

# Re-export pingora types for compatibility
pingora = { version = "0.5", features = ["proxy"], default-features = false }